        <style>
          h1{
    width:200px;                              /* width of box */
    height:100px;                             /* height of box */
    background-color:rgb(255, 169, 40);            /* color to box */

    /* BORDER */
    border-width:3px;                           /* thicknes/size of border */
    border-style:solid;                         /* style of border */
    border-color:brown;                      /* color to border */

    border-radius: 20px;                        /* radius of border */
    border:6px solid brown;                  /* all feature in one line */   
              
    /* PADDING */                              /* The space between border and content */
    padding-top:10px;
    padding-left:10px;
    padding-right:25px;
    padding-bottom:0px; 
   
    padding:5px 4px 2px 5px;       
   padding:5px;          
 }
#divf{ 
     /* MARGINE */
     margin-top:20px;              /* space between boxes */
     margin-left:50px;             /* space from page left side */
     margin-right:20px;
     margin-bottom:20px;
    
   margin:50px;                      /*   give the same margine to all side  */
   margin:20px 50px 40px 30px 10px;    /* all value in one line */
 
    width:200px;
    height:100px;
    background-color:hwb(125 10% 36%);

    padding-top:10px;
    padding-left:10px;
                                        
}
p{
  /*DISPLAY PROPERTY*/

  /* inline:   take only the space required by element no margine/no padding like button
     block:    take full space available in width*/
      
    width:200px;                           
    height:100px;

    /* RGBA Alpha channel */
    background-color:rgba(255, 0, 0, 0.1);    /* (rgba) here A is called alpha channel alpha decide the opacity of couler */
}

       ( UNIT 3 )
            
         /*PERCANTAGE(%)  and EM */
#box1{
         /*Used with child box to give them % from parant box px 
         like 200px in parant box now we use the 20px for child we can use 10%*/
            
  width:100px;                              
    height:100px;                             
    background-color:rgb(255, 169, 40); 

    font-size:20px;       
}
#box2{
  width:50%;                              
    height:50%;  
    margin-left:5%; 
     background-color:rgb(255, 0, 0);

    /*EM means jithna size parant box mai use howa hai utne hai agar muje child mai 
use karna ho to mai 1 em likkonga our agar uski double use karna ho tho 2em*/
    font-size:0em;                 
}            

#box3{
margin-bottom:50px;
margin-top:20px;

  background-color:rgb(0, 254, 254);
  width:100px;
    height:100px;
  border:2px, solid,rgb(0, 0, 0);

}
#box4{

  margin-bottom: 50px;
margin-top: 20px;

  background-color:rgb(0, 255, 255);
  width:100px;
    height:100px;
  border:2px, solid,rgb(0, 0, 0);
display:inline-block;
}
               /* POSITION:    How an element is positioned in a documents */
div{
          height:100px;
          width:100px;
          background-color:aqua;
          border:2px solid rgb(0, 0, 0);
          display: inline-block;
         }  
#div6{                
          position:relative;     /*relative means: jaha pehli iski bourder thi waha se move krega*/    
          top:10px;
          left:150px;
         }
#div7{
          position:absolute;    /*Absolute means: jaha se page shoro hoti hai waha se move krega*/
          left:90px;
          top:800px;
          background-color:bisque;
         }
#div8{
          position:fixed;   /*Fixed means: us box ka position ik jaga pai hoga
                                scroling se bhi chang nahi hoga*/
          top:10px;
          left:280px;
       
         }
#div9{
          position:sticky;  /*Sticky means: scroling karthe jaha pai ye box mil 
                             gaya waha se ye box fixed hoga our scoll nahi hoga*/
          top:0px;
          left:30px;

          z-index:-1;    /*jab ham kisi index ko kisi dosre index ke oper dikana chahte hai 
                          to ham z-index ke value ko positive karte hai ab -hai to niche hai*/
         }

         /*BACKGROUND IMAGE*/
#div8{
    background-image:url("cat.jpg"); /* background mai imag ko use karte  hai*/
         background-size:cover;     /*cover: agar photo box se bara hai to jitne asakte hai wahi ayega baqaya cut hoga*/
         background-size:auto;      /*Auto: box ke size jitna ho photo ke size mai se utna ayega  khowa waho dikaye de ya na*/
         background-size:contain;   /*contain:photo jitna bi ho waho choje box mai fit hoga*/
        
}

    </style>
</head>
<body>
    <h1>hello </h1>
         <button>Inline element</button> 
      
    <div id="divf"> this is a dev1.</div>
    <p>inline element<br> used rgba</p>

<div id="box1">parant box1 
    <div id="box2">child box2</div>

    <div id="div6">div6</div>
        <div id="div7">div7</div>
            <div id="div8">div8</div>
              <div id="div9">div9</div>
</body>
