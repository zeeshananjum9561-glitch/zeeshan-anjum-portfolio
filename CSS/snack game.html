<!DOCTYPE html>
<html>
<head>
<title>Snake Game (Simple)</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
}

#game-container {
  width: 300px;
  height: 300px;
  border: 1px solid black;
  margin: 40px auto;
  position: relative;
  background: #f9f9f9;
}

#snake {
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: black;
  top: 0;
  left: 0;
}

#food {
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: rgb(228, 31, 13);
}

#score {
  font-size: 20px;
  margin-top: 20px;
}
</style>
</head>
<body>
<h1>Snake Game made by zeeshan</h1>
<div id="game-container">
  <div id="snake"></div>
  <div id="food"></div>
</div>
<p id="score">Score: 0</p>

<!-- Buttons -->
<button onclick="moveSnake('up')">up</button>
<button onclick="moveSnake('down')">Down</button>
<button onclick="moveSnake('left')">Left</button>
<button onclick="moveSnake('right')">Right</button>

<script>
const snake = document.getElementById("snake");
const food = document.getElementById("food");
const scoreElement = document.getElementById("score");

let snakeX = 0, snakeY = 0;
let foodX = 100, foodY = 100;
let score = 0;

// Initial food position
food.style.top = foodY + "px";
food.style.left = foodX + "px";

function moveSnake(direction) {
  if (direction === "up") snakeY -= 20;
  if (direction === "down") snakeY += 20;
  if (direction === "left") snakeX -= 20;
  if (direction === "right") snakeX += 20;

  // Move snake
  snake.style.top = snakeY + "px";
  snake.style.left = snakeX + "px";

  // Check collision
  if (snakeX === foodX && snakeY === foodY) {
    score++;
    scoreElement.textContent = "Score: " + score;

    // Random food placement
    foodX = Math.floor(Math.random() * 15) * 20;
    foodY = Math.floor(Math.random() * 15) * 20;
    food.style.top = foodY + "px";
    food.style.left = foodX + "px";
  }
}

// Also allow keyboard control
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp") moveSnake("up");
  if (e.key === "ArrowDown") moveSnake("down");
  if (e.key === "ArrowLeft") moveSnake("left");
  if (e.key === "ArrowRight") moveSnake("right");
});
</script>
</body>
</html>
