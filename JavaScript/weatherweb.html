<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline — Weather Now</title>

  <!-- Typography: Outfit for display, Inter for body/data -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============================================================
   SKYLINE — Weather App Styles
   Design language: a night-sky gradient that shifts hue to
   match the actual weather condition returned by the API.
   ============================================================ */

:root {
  /* Base palette */
  --ink: #0b1026;
  --steel: #1e3a5f;
  --amber: #ffb454;
  --cyan: #7de0ff;
  --text-primary: #f5f7fa;
  --text-muted: #a9b4c9;

  /* Glass card */
  --glass-bg: rgba(255, 255, 255, 0.07);
  --glass-border: rgba(255, 255, 255, 0.16);
  --glass-shadow: rgba(0, 0, 0, 0.35);

  /* Default sky gradient (before any search) */
  --sky-a: #0b1026;
  --sky-b: #1e3a5f;
  --sky-c: #12244a;

  --radius-lg: 28px;
  --radius-md: 16px;
  --radius-sm: 10px;

  --font-display: 'Outfit', sans-serif;
  --font-body: 'Inter', sans-serif;
}

/* ---------- Weather-based sky themes ---------- */
/* Each state re-paints the ambient background to match the sky. */

body.weather-clear {
  --sky-a: #12203f;
  --sky-b: #ff9d5c;
  --sky-c: #ffcf7a;
}

body.weather-clouds {
  --sky-a: #232c3d;
  --sky-b: #4b5d78;
  --sky-c: #6d7f9a;
}

body.weather-rain,
body.weather-drizzle {
  --sky-a: #0a1420;
  --sky-b: #16374a;
  --sky-c: #1f5c6b;
}

body.weather-thunderstorm {
  --sky-a: #08060f;
  --sky-b: #241638;
  --sky-c: #3a1f4d;
}

body.weather-snow {
  --sky-a: #1a2436;
  --sky-b: #8fb4d1;
  --sky-c: #dfeefb;
}

body.weather-mist,
body.weather-haze,
body.weather-fog {
  --sky-a: #1c1f2b;
  --sky-b: #4a4f63;
  --sky-c: #7c8199;
}

/* ============================================================
   Reset & base
   ============================================================ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  background: linear-gradient(160deg, var(--sky-a) 0%, var(--sky-b) 55%, var(--sky-c) 100%);
  transition: background 1.1s ease;
  position: relative;
}

/* ============================================================
   Ambient sky layer (decorative, behind content)
   ============================================================ */

.sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.sun-glow {
  position: absolute;
  top: -12%;
  right: -8%;
  width: 45vmax;
  height: 45vmax;
  border-radius: 50%;
  background: radial-gradient(circle, var(--sky-c) 0%, transparent 70%);
  opacity: 0.35;
  transition: background 1.1s ease;
}

.cloud {
  position: absolute;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 50%;
  filter: blur(2px);
}

.cloud--a {
  width: 320px;
  height: 320px;
  top: 8%;
  left: -10%;
  animation: drift 38s linear infinite;
}

.cloud--b {
  width: 220px;
  height: 220px;
  top: 55%;
  left: -15%;
  animation: drift 52s linear infinite;
  animation-delay: -14s;
}

.cloud--c {
  width: 160px;
  height: 160px;
  top: 30%;
  left: -20%;
  animation: drift 65s linear infinite;
  animation-delay: -30s;
}

@keyframes drift {
  from { transform: translateX(0); }
  to   { transform: translateX(140vw); }
}

@media (prefers-reduced-motion: reduce) {
  .cloud { animation: none; }
}

/* ============================================================
   Layout
   ============================================================ */

.page {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 48px 20px 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}

.brand__mark {
  font-size: 22px;
  filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35));
}

.brand__name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.02em;
}

/* ============================================================
   Search bar
   ============================================================ */

.search {
  width: 100%;
  display: flex;
  gap: 10px;
  margin-bottom: 28px;
}

.search__input {
  flex: 1;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 15px;
  outline: none;
  transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
}

.search__input::placeholder {
  color: var(--text-muted);
}

.search__input:focus {
  border-color: var(--cyan);
  background: rgba(255, 255, 255, 0.1);
}

.search__button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--amber), #ff8a5c);
  color: #24160a;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  box-shadow: 0 6px 18px rgba(255, 140, 70, 0.25);
}

.search__button:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow: 0 10px 22px rgba(255, 140, 70, 0.35);
}

.search__button:active {
  transform: translateY(0);
}

.search__icon {
  width: 17px;
  height: 17px;
}

@media (max-width: 420px) {
  .search__button span { display: none; }
  .search__button { padding: 14px; }
}

/* ============================================================
   Status states: loading / error
   ============================================================ */

.status {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  color: var(--text-muted);
  padding: 40px 12px;
  animation: fadeIn 0.35s ease;
}

.status--error {
  color: #ffb4b4;
}

.status__icon {
  width: 34px;
  height: 34px;
}

.spinner {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-top-color: var(--cyan);
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   Weather card
   ============================================================ */

.card {
  width: 100%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 20px 50px var(--glass-shadow);
  padding: 28px 26px 26px;
  animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.card__top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.card__city {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  line-height: 1.2;
}

.card__country {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 2px;
}

.card__updated {
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 6px;
  opacity: 0.8;
}

.card__icon-wrap {
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card__icon {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.25));
}

.card__temp-row {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 6px;
}

.card__temp {
  font-family: var(--font-display);
  font-size: 64px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
}

.card__condition-main {
  font-size: 17px;
  font-weight: 600;
}

.card__condition-desc {
  font-size: 13px;
  color: var(--text-muted);
  text-transform: capitalize;
  margin-top: 2px;
}

.card__feels {
  margin-top: 12px;
  font-size: 14px;
  color: var(--text-muted);
}

.card__feels span {
  color: var(--text-primary);
  font-weight: 600;
}

.card__divider {
  height: 1px;
  background: var(--glass-border);
  margin: 22px 0 18px;
}

/* ---------- Detail grid ---------- */

.details {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px 10px;
}

.detail {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 8px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.03);
  transition: background 0.2s ease, transform 0.2s ease;
}

.detail:hover {
  background: rgba(255, 255, 255, 0.07);
  transform: translateY(-2px);
}

.detail__label {
  font-size: 11.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.detail__value {
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font-display);
}

@media (max-width: 380px) {
  .details {
    grid-template-columns: repeat(2, 1fr);
  }
  .card__temp {
    font-size: 52px;
  }
}

/* ============================================================
   Hint text
   ============================================================ */

.hint {
  margin-top: 28px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
}

  </style>
</head>
<body class="weather-default">

  <!-- Ambient sky layer: soft drifting cloud shapes behind everything -->
  <div class="sky" aria-hidden="true">
    <div class="cloud cloud--a"></div>
    <div class="cloud cloud--b"></div>
    <div class="cloud cloud--c"></div>
    <div class="sun-glow"></div>
  </div>

  <main class="page">

    <header class="brand">
      <span class="brand__mark">☁</span>
      <h1 class="brand__name">Skyline</h1>
    </header>

    <!-- Search -->
    <form class="search" id="searchForm" autocomplete="off">
      <input
        type="text"
        id="cityInput"
        class="search__input"
        placeholder="Search a city — e.g. Islamabad"
        aria-label="City name"
      />
      <button type="submit" class="search__button" id="searchBtn">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>
    </form>

    <!-- Status states -->
    <div class="status" id="loadingState" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Fetching the sky over your city…</p>
    </div>

    <div class="status status--error" id="errorState" hidden>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="status__icon">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="8" x2="12" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="16.2" r="1" fill="currentColor"/>
      </svg>
      <p id="errorMessage">Something went wrong.</p>
    </div>

    <!-- Weather card -->
    <section class="card" id="weatherCard" hidden>

      <div class="card__top">
        <div class="card__location">
          <h2 class="card__city" id="cityName">—</h2>
          <p class="card__country" id="countryName">—</p>
          <p class="card__updated" id="updatedAt"></p>
        </div>
        <div class="card__icon-wrap">
          <img id="weatherIcon" class="card__icon" src="" alt="" />
        </div>
      </div>

      <div class="card__temp-row">
        <span class="card__temp" id="temperature">—°</span>
        <div class="card__condition">
          <p class="card__condition-main" id="conditionMain">—</p>
          <p class="card__condition-desc" id="conditionDesc">—</p>
        </div>
      </div>

      <p class="card__feels">Feels like <span id="feelsLike">—°</span></p>

      <div class="card__divider"></div>

      <!-- Detail grid -->
      <div class="details">
        <div class="detail">
          <span class="detail__label">Humidity</span>
          <span class="detail__value" id="humidity">—</span>
        </div>
        <div class="detail">
          <span class="detail__label">Wind</span>
          <span class="detail__value" id="windSpeed">—</span>
        </div>
        <div class="detail">
          <span class="detail__label">Pressure</span>
          <span class="detail__value" id="pressure">—</span>
        </div>
        <div class="detail">
          <span class="detail__label">Visibility</span>
          <span class="detail__value" id="visibility">—</span>
        </div>
        <div class="detail">
          <span class="detail__label">Sunrise</span>
          <span class="detail__value" id="sunrise">—</span>
        </div>
        <div class="detail">
          <span class="detail__label">Sunset</span>
          <span class="detail__value" id="sunset">—</span>
        </div>
      </div>
    </section>

    <!-- First-load hint, shown before any search happens -->
    <p class="hint" id="hintText">Try "London", "Lahore", or "Tokyo" to get started.</p>

  </main>

  <script>
    /* ============================================================
   SKYLINE — Weather App Logic
   Vanilla JS, Fetch API, async/await.
   Data source: WeatherAPI.com (forecast.json — gives current
   conditions + today's astro data for sunrise/sunset in one call)
   ============================================================ */

// ---------------------------------------------------------------
// Configuration
// ---------------------------------------------------------------
const CONFIG = {
  // Replace with your own key from https://www.weatherapi.com/ if needed.
  API_KEY: "6c39d0e7706645d681255107260507",
  // Using forecast.json (not current.json) because it's the endpoint
  // that also returns today's sunrise/sunset under forecast.astro.
  BASE_URL: "https://api.weatherapi.com/v1/forecast.json",
  AQI: "yes",
};

// ---------------------------------------------------------------
// DOM references (grabbed once, reused everywhere)
// ---------------------------------------------------------------
const elements = {
  form: document.getElementById("searchForm"),
  input: document.getElementById("cityInput"),
  searchBtn: document.getElementById("searchBtn"),

  loadingState: document.getElementById("loadingState"),
  errorState: document.getElementById("errorState"),
  errorMessage: document.getElementById("errorMessage"),
  hint: document.getElementById("hintText"),

  card: document.getElementById("weatherCard"),
  cityName: document.getElementById("cityName"),
  countryName: document.getElementById("countryName"),
  updatedAt: document.getElementById("updatedAt"),
  weatherIcon: document.getElementById("weatherIcon"),
  temperature: document.getElementById("temperature"),
  conditionMain: document.getElementById("conditionMain"),
  conditionDesc: document.getElementById("conditionDesc"),
  feelsLike: document.getElementById("feelsLike"),

  humidity: document.getElementById("humidity"),
  windSpeed: document.getElementById("windSpeed"),
  pressure: document.getElementById("pressure"),
  visibility: document.getElementById("visibility"),
  sunrise: document.getElementById("sunrise"),
  sunset: document.getElementById("sunset"),

  body: document.body,
};

// ---------------------------------------------------------------
// UI state helpers
// ---------------------------------------------------------------

/** Hide every state panel (loading, error, card, hint). */
function hideAllStates() {
  elements.loadingState.hidden = true;
  elements.errorState.hidden = true;
  elements.card.hidden = true;
  elements.hint.hidden = true;
}

function showLoading() {
  hideAllStates();
  elements.loadingState.hidden = false;
  setSearchDisabled(true);
}

function showError(message) {
  hideAllStates();
  elements.errorMessage.textContent = message;
  elements.errorState.hidden = false;
  setSearchDisabled(false);
}

function showCard() {
  hideAllStates();
  elements.card.hidden = false;
  setSearchDisabled(false);
}

function setSearchDisabled(isDisabled) {
  elements.searchBtn.disabled = isDisabled;
  elements.input.disabled = isDisabled;
  elements.searchBtn.style.opacity = isDisabled ? "0.7" : "1";
}

// ---------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------

/** "Wednesday, 3:45 PM" style local-machine timestamp for "last updated". */
function formatNow() {
  return new Date().toLocaleString(undefined, {
    weekday: "long",
    hour: "numeric",
    minute: "2-digit",
  });
}

/**
 * WeatherAPI's icon URLs are protocol-relative ("//cdn.weatherapi.com/...").
 * Prefix with https: so they load correctly everywhere, including file://.
 */
function normalizeIconUrl(url) {
  return url.startsWith("//") ? `https:${url}` : url;
}

/**
 * WeatherAPI gives free-text conditions ("Patchy rain possible",
 * "Overcast", "Thundery outbreaks possible"...) rather than a fixed
 * enum, so we match keywords to pick a sky theme.
 */
function themeClassFor(conditionText) {
  const text = conditionText.toLowerCase();

  if (text.includes("thunder")) return "weather-thunderstorm";
  if (text.includes("snow") || text.includes("sleet") || text.includes("ice") || text.includes("blizzard")) return "weather-snow";
  if (text.includes("rain") || text.includes("drizzle") || text.includes("shower")) return "weather-rain";
  if (text.includes("mist") || text.includes("fog") || text.includes("haze")) return "weather-mist";
  if (text.includes("overcast") || text.includes("cloud")) return "weather-clouds";
  if (text.includes("sun") || text.includes("clear")) return "weather-clear";

  return "weather-default";
}

/** Swap the body's theme class to match the current weather. */
function applyTheme(conditionText) {
  const themeClasses = [
    "weather-default",
    "weather-clear",
    "weather-clouds",
    "weather-rain",
    "weather-thunderstorm",
    "weather-snow",
    "weather-mist",
  ];
  elements.body.classList.remove(...themeClasses);
  elements.body.classList.add(themeClassFor(conditionText));
}

// ---------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------

/** Populate the weather card with data from the API response. */
function renderWeather(data) {
  const { location, current, forecast } = data;
  const astro = forecast.forecastday[0].astro;

  elements.cityName.textContent = location.name;
  elements.countryName.textContent = location.country || "";
  elements.updatedAt.textContent = `Updated ${formatNow()}`;

  elements.weatherIcon.src = normalizeIconUrl(current.condition.icon);
  elements.weatherIcon.alt = current.condition.text;

  elements.temperature.textContent = `${Math.round(current.temp_c)}°`;
  elements.conditionMain.textContent = current.condition.text;
  elements.conditionDesc.textContent = `${current.is_day ? "Daytime" : "Nighttime"} · ${current.cloud}% cloud cover`;
  elements.feelsLike.textContent = `${Math.round(current.feelslike_c)}°`;

  elements.humidity.textContent = `${current.humidity}%`;
  elements.windSpeed.textContent = `${Math.round(current.wind_kph)} km/h`;
  elements.pressure.textContent = `${Math.round(current.pressure_mb)} hPa`;
  elements.visibility.textContent = `${current.vis_km} km`;
  elements.sunrise.textContent = astro.sunrise;
  elements.sunset.textContent = astro.sunset;

  applyTheme(current.condition.text);
  showCard();
}

// ---------------------------------------------------------------
// Networking
// ---------------------------------------------------------------

/**
 * Fetch current weather + today's astro data for a given city name.
 * Throws a descriptive Error for the UI layer to catch and display.
 */
async function fetchWeather(city) {
  const url = `${CONFIG.BASE_URL}?key=${CONFIG.API_KEY}&q=${encodeURIComponent(city)}&days=1&aqi=${CONFIG.AQI}&alerts=no`;

  let response;
  try {
    response = await fetch(url);
  } catch (networkError) {
    // fetch() itself rejects on DNS failure / offline / CORS block
    throw new Error("No internet connection. Please check your network and try again.");
  }

  // WeatherAPI returns a JSON body even on errors: { error: { code, message } }
  let payload;
  try {
    payload = await response.json();
  } catch (parseError) {
    throw new Error("Received an unexpected response from the weather service.");
  }

  if (!response.ok || payload.error) {
    const code = payload.error && payload.error.code;

    if (code === 1006) {
      throw new Error(`We couldn't find "${city}". Check the spelling and try again.`);
    }
    if (code === 2006 || code === 2008 || code === 1002) {
      throw new Error("Invalid API key. Please check your WeatherAPI key.");
    }
    throw new Error((payload.error && payload.error.message) || `Something went wrong (error ${response.status}).`);
  }

  return payload;
}
async function handleSearch(city) {
  const trimmedCity = city.trim();

  if (!trimmedCity) {
    showError("Please enter a city name.");
    return;
  }

  showLoading();

  try {
    const data = await fetchWeather(trimmedCity);
    renderWeather(data);
  } catch (error) {
    showError(error.message || "Something went wrong. Please try again.");
  }
}

// ---------------------------------------------------------------
// Event wiring
// ---------------------------------------------------------------

elements.form.addEventListener("submit", (event) => {
  event.preventDefault();
  handleSearch(elements.input.value);
});

// Auto-load a default city on first visit so the card isn't empty.
window.addEventListener("DOMContentLoaded", () => {
  handleSearch("Islamabad");
});

  </script>
</body>
</html>
