<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <link rel="stylesheet" href="level4.Css">
    <style>
         .container{
            height: auto;
            width: 600px;
            border: 2px solid black;
            display:flex;
            justify-content: center; /*sare contain ko center mai rakthe hai*/
            align-items:center;    /* contain ko container ki bitcsh mai raknr kelay*/
            /*flex-direction:column-reverse;*/
           align-content:start ;
            flex-wrap:wrap;   /*jab contain container  se bahir nikalthi hai tho phir wrap usko dosre line mai leker jathe hai
                                wrap reverse contain ko reverse karhte hai */
            gap: 5px;       /* Gap just like margin use for space between items*/
        }
        .item{
            height: 60px;
            width: 50px;
            border: 2px solid black;
            margin:4px;
            background-color: blueviolet;
        }



        /* SET #6 use  MAKE Navbar usig flex box    */
        ul{
            background-color:rgb(0, 0, 0);
            display:flex;
            justify-content:space-evenly;      /*make space between names*/
        }
        a{
            text-decoration:none;
            color:rgb(255, 255, 255);
        }
        li{
            list-style-type:none;
            background-color:rgb(16, 15, 15);
        }


        

/* SET #6 use flex box to center one div inside another div  */
        .set{
            height:250px;
            width:200px;
            border: 2px black solid;
            background-color: rgb(255, 0, 251);
            display: flex;
            justify-content: center;       /*horizontel center*/
            align-items:center;         /*verticle center*/
           
        }
        #set2{
                        height:100px;
            width:50px;
            border: 2px black solid;
            background-color: rgb(255, 0, 0);
            margin:30px;
        }




        /* MEDIA queries */
      #a1 {
               height:100px;
            width:50px;
            border: 2px black solid;
            background-color: rgb(49, 56, 130);
            display:inline-block;
        }
@media(max-width: 300px){   /*media query mean: screen size ke mutabiq apka website ki color set hoga
                         jham condition bhi set kar sakthe hai min max*/
    #a1 {
        background-color: rgb(113, 189, 20);
    }
}
@media(min-width:300px) and (max-width:400px){ /*and ke zareye ham limmetet bhi set kar sakthe hai 200 se 400px tak color kisa hoga*/
      body{
        background-color: pink;
}
}

    </style>


<body>
    <h1>Flexbox Playground</h1>

    <div class="container">
        <div class="item">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">1</div>
       <div class="item">2</div>
       <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">5</div>
    </div>

<div id="div1">
 <ul>
    <li><a href="#">home</a></li>
    <li><a href="#">about us</a></li>
    <li><a href="#">contact us</a></li>
    <li><a href="#">Help</a></li>
</ul>
</div>

<div class="set">
    <div id="set2"> </div>
</div>

<div id="a1"></div>

</body>
</html>
